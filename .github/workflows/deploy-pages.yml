name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/nutrition-macro-tracker-58s4tx
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Repository variables (Settings -> Secrets and variables -> Actions -> Variables).
          # Neither value is sensitive on its own -- see cloudflare-worker/README.md. Unset
          # until you complete that setup; the app shows a "not configured" message instead of
          # a broken WHOOP connect button until both are set.
          VITE_WHOOP_CLIENT_ID: ${{ vars.VITE_WHOOP_CLIENT_ID }}
          VITE_WHOOP_TOKEN_PROXY_URL: ${{ vars.VITE_WHOOP_TOKEN_PROXY_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
